services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mangafind:local
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
